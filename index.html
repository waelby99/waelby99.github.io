<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wael Ben Youssef | Portfolio Under Construction</title>
  <meta
    name="description"
    content="Wael Ben Youssef's portfolio is currently under construction."
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f2eb;
      color: #1f2933;
    }

    .container {
      width: 100%;
      max-width: 760px;
      text-align: center;
      padding: 58px 34px;
      background: #fffdf8;
      border: 1px solid #ddd8cf;
      border-radius: 18px;
      box-shadow: 0 22px 60px rgba(31, 41, 51, 0.10);
    }

    .gear-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 22px;
    }

    .gear {
      font-size: 82px;
      line-height: 1;
      display: inline-block;
      animation: spin 4s linear infinite;
      filter: grayscale(1) sepia(1) saturate(3) hue-rotate(345deg);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .badge {
      display: inline-block;
      margin-bottom: 22px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #f3e6c9;
      border: 1px solid #d8bd83;
      color: #7a5b1f;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 18px;
      font-size: clamp(34px, 7vw, 62px);
      line-height: 1.08;
      color: #20252b;
    }

    .name {
      color: #2f343a;
    }

    .message {
      max-width: 590px;
      margin: 0 auto 28px;
      color: #626970;
      font-size: 18px;
      line-height: 1.7;
    }

    .date {
      display: inline-block;
      padding-top: 20px;
      border-top: 1px solid #ddd8cf;
      color: #7b8188;
      font-size: 15px;
    }

    .date strong {
      color: #2f343a;
    }

    footer {
      margin-top: 34px;
      color: #9a9489;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="gear-wrap">
      <div class="gear" aria-hidden="true">⚙️</div>
    </div>

    <div class="badge">Under Construction</div>

    <h1>
      <span class="name">Wael Ben Youssef</span><br />
      Portfolio
    </h1>

    <p class="message">
      My portfolio is currently under construction while I work on improvements
      and updates. It will be back online soon.
    </p>

    <p class="date">
      Under construction since <strong>September 12, 2026</strong>
    </p>

    <footer>
      &copy; 2026 Wael Ben Youssef. All rights reserved.
    </footer>
  </main>
</body>
</html>
